name: Sekoly Family Host Diagnose

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sekoly-family-host-diagnose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect GitHub Pages and Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          GH="https://romuel10.github.io/romuel-app-store/sekoly/enrollment/index.html?code=b9cf624c992b4a2e9a56"
          CF="https://romuelapps.pages.dev/sekoly/enrollment/index.html?code=b9cf624c992b4a2e9a56"
          for target in GH CF; do
            if [ "$target" = GH ]; then url="$GH"; else url="$CF"; fi
            echo "=== $target $url ==="
            for i in $(seq 1 30); do
              curl -sS -D /tmp/h -o /tmp/b "$url" || true
              status="$(awk 'NR==1{print $2}' /tmp/h 2>/dev/null || true)"
              type="$(grep -i '^content-type:' /tmp/h | tail -1 | tr -d '\r' || true)"
              marker="$(grep -c '2026-09-29-cloudflare-v1' /tmp/b 2>/dev/null || true)"
              echo "attempt=$i status=$status type=$type marker=$marker"
              if [ "$status" = "200" ] && echo "$type" | grep -qi 'text/html' && [ "$marker" -gt 0 ]; then
                break
              fi
              sleep 6
            done
            echo "--- headers ---"
            sed -n '1,30p' /tmp/h
            echo "--- body ---"
            head -c 180 /tmp/b; echo
          done
